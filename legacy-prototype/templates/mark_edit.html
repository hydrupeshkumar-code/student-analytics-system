{% extends 'base.html' %}{% set page_title='Edit Mark' %}{% block title %}Edit Mark{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-xl-7"><div class="card panel-card border-0"><div class="card-header bg-transparent border-0"><div class="eyebrow">Assessment record</div><h3 class="fw-bold mb-0">Edit mark</h3></div><form method="post" class="card-body"><label class="form-label">Student</label><select class="form-select mb-3" name="student_id" required>{% for s in students %}<option value="{{ s.id }}" {% if s.id==mark.student_id %}selected{% endif %}>{{ s.name }} · {{ s.student_id }}</option>{% endfor %}</select><label class="form-label">Subject</label><select class="form-select mb-3" name="subject_id" required>{% for sub in subjects %}<option value="{{ sub.id }}" {% if sub.id==mark.subject_id %}selected{% endif %}>{{ sub.subject_name }}</option>{% endfor %}</select><label class="form-label">Examination</label><input class="form-control mb-3" name="exam_type" value="{{ mark.exam_type }}" required><div class="row g-2"><div class="col-6"><label class="form-label">Marks</label><input class="form-control" type="number" step="0.1" min="0" name="marks" value="{{ mark.marks }}" required></div><div class="col-6"><label class="form-label">Max marks</label><input class="form-control" type="number" step="0.1" min="1" name="max_marks" value="{{ mark.max_marks }}" required></div></div><label class="form-label mt-3">Date</label><input class="form-control mb-4" type="date" name="date" value="{{ mark.date }}" required><div class="d-flex gap-2"><a class="btn btn-light" href="{{ url_for('marks') }}">Cancel</a><button class="btn btn-primary">Save changes</button></div></form></div></div></div>{% endblock %}
