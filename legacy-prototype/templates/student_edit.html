{% extends 'base.html' %}{% set page_title='Edit Student' %}{% block title %}Edit Student{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-xl-8"><div class="card panel-card border-0"><div class="card-header bg-transparent border-0"><div class="eyebrow">Student management</div><h3 class="fw-bold mb-0">Edit {{ student.name }}</h3></div><form method="post" class="card-body"><div class="row g-3"><div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" value="{{ student.name }}" required></div><div class="col-md-6"><label class="form-label">Student ID</label><input class="form-control" value="{{ student.student_id }}" disabled></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" value="{{ student.email }}" required></div><div class="col-md-6"><label class="form-label">New password</label><input class="form-control" type="password" name="password" placeholder="Leave blank to keep current"></div><div class="col-md-4"><label class="form-label">Department</label><input class="form-control" name="department" value="{{ student.department }}"></div><div class="col-md-2"><label class="form-label">Semester</label><input class="form-control" type="number" name="semester" value="{{ student.semester }}" min="1" max="12"></div><div class="col-md-3"><label class="form-label">Section</label><input class="form-control" name="section" value="{{ student.section }}"></div><div class="col-md-3"><label class="form-label">Roll Number</label><input class="form-control" name="roll_number" value="{{ student.roll_number }}"></div></div><div class="mt-4 d-flex gap-2"><a class="btn btn-light" href="{{ url_for('students') }}">Cancel</a><button class="btn btn-primary">Save changes</button></div></form></div></div></div>{% endblock %}
