# Render Blueprint — Student Assessment & Analytics Platform (SAAP)
#
# Deploy: Render dashboard → New → Blueprint → pick this repository → Apply.
# Render asks for the values marked `sync: false` (first admin email/password) during setup.
#
# One web service (FastAPI API + built React UI, from the Dockerfile) and a managed PostgreSQL
# database. On every start the container runs migrations, then the first-run bootstrap
# (creates the admin from INITIAL_ADMIN_* and optionally loads demo data), then serves on $PORT.

services:
  - type: web
    name: saap
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free                      # change to starter or higher for an always-on instance
    region: singapore               # closest Render region to India
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: saap-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true         # strong random secret generated by Render
      - key: WEB_CONCURRENCY
        value: "1"                  # free instances have 512 MB RAM; raise on bigger plans
      - key: ACCESS_TOKEN_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      # First administrator, created on first start if that email does not exist yet.
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false                 # at least 8 characters with letters and numbers
      - key: INITIAL_ADMIN_NAME
        value: Exam Cell Administrator
      # "true" loads the demo institution (3 courses, 40 students) into an EMPTY database — for demos only.
      - key: SEED_DEMO
        value: "false"

databases:
  - name: saap-db
    databaseName: saap
    user: saap
    plan: free                      # free Render Postgres expires after 30 days; use basic-256mb or higher for real use
    region: singapore
    postgresMajorVersion: "16"
